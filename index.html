<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e17">
<title>星幕影城 · 在线选座</title>
<style>
:root{
  --bg:#0b0e17; --panel:#151a2b; --panel2:#1d2440; --line:#272f4d;
  --txt:#e9edf8; --sub:#8a93b8; --accent:#ff4f6e; --accent2:#ffb45c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{min-height:100%;background:radial-gradient(900px 480px at 50% -8%,#232b52 0%,var(--bg) 60%) fixed;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;touch-action:manipulation}
.page{max-width:640px;margin:0 auto;padding:18px 14px 120px}
.top{display:flex;align-items:baseline;gap:10px}
.logo{font-size:21px;font-weight:800;letter-spacing:1px}
.top .sub{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:9px;margin:16px 0 10px}
.tab{flex:1;padding:8px 0 7px;text-align:center;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--sub);font-size:14px;cursor:pointer;transition:.2s;user-select:none}
.tab small{display:block;font-size:10px;font-weight:400;opacity:.7;margin-top:2px}
.tab.active{background:linear-gradient(135deg,var(--accent),#ff7a59);color:#fff;font-weight:700;border-color:transparent;box-shadow:0 4px 16px rgba(255,79,110,.35)}
.hall-info{font-size:12px;color:var(--sub);margin-bottom:12px;text-align:center}
.movie-card{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#20264a,#161b33 70%);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.mc-ico{font-size:26px}
.mc-title{font-size:16px;font-weight:700}
.mc-meta{font-size:12px;color:var(--sub);margin-top:3px}
.mc-tag{margin-left:auto;font-size:11px;color:#ffd28a;border:1px solid rgba(255,210,138,.4);padding:2px 8px;border-radius:999px;background:rgba(255,210,138,.08);white-space:nowrap}
.screen-wrap{perspective:420px;margin:24px 28px 0}
.screen{height:24px;border-radius:50% 50% 0 0 / 100% 100% 0 0;background:linear-gradient(180deg,#4a5b96,#101528 92%);box-shadow:0 0 26px rgba(100,130,255,.28),inset 0 -8px 18px rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;transform:rotateX(6deg)}
.screen span{margin-top:7px;font-size:11px;letter-spacing:4px;color:#aebce8}
#seatArea{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.srow{display:flex;align-items:center;gap:6px}
.rlabel{width:30px;flex:none;font-size:11px;color:var(--sub);text-align:center}
.blocks{display:flex;gap:14px;flex:1}
.block{display:grid;gap:5px;grid-template-columns:repeat(var(--cols),1fr);flex:1}
.zone{flex:1;text-align:center;font-size:10px;color:var(--sub);letter-spacing:1px;padding-bottom:4px}
.seat{aspect-ratio:1;border-radius:5px 5px 2px 2px;background:#263052;border:1px solid rgba(255,255,255,.06);color:#a9b4d8;font-size:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,box-shadow .2s;user-select:none}
.seat:active{transform:scale(.85)}
.seat.sold{background:#121729;color:#39415f;border-color:rgba(255,255,255,.02);cursor:default}
.seat.sel{background:linear-gradient(160deg,var(--accent),var(--accent2));color:#fff;font-weight:700;border-color:transparent;box-shadow:0 0 10px rgba(255,90,120,.6);animation:pop .25s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.seat.couple{aspect-ratio:2/1;border-radius:9px 9px 3px 3px;font-size:9px;background:linear-gradient(160deg,#2c3357,#263052)}
.seat.couple i{font-style:normal;font-size:7px;margin-right:2px}
.seat.couple b{font-weight:600}
.legend{display:flex;align-items:center;gap:14px;margin-top:14px;font-size:11px;color:var(--sub);flex-wrap:wrap}
.legend .s{display:inline-block;width:13px;height:13px;border-radius:4px 4px 2px 2px;margin-right:4px;vertical-align:-2px;background:#263052;border:1px solid rgba(255,255,255,.06)}
.legend .s-sold{background:#121729}
.legend .s-sel{background:linear-gradient(160deg,var(--accent),var(--accent2));border-color:transparent}
.legend-tip{margin-left:auto;color:#f6c453;font-size:10px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(10,13,23,.93);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bottom-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.sel-chips{flex:1;display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);padding:3px 4px 3px 10px;border-radius:999px;font-size:12px}
.chip b{color:var(--accent2);cursor:pointer;padding:0 3px;font-size:13px}
.bt-empty{font-size:12px;color:var(--sub)}
.bt-total{font-size:12px;color:var(--sub);white-space:nowrap}
.bt-total b{font-size:19px;color:var(--accent2)}
#confirmBtn{background:linear-gradient(135deg,var(--accent),#ff7a59);border:none;color:#fff;font-size:15px;font-weight:700;padding:11px 22px;border-radius:999px;cursor:pointer;box-shadow:0 4px 16px rgba(255,79,110,.35);white-space:nowrap}
#confirmBtn:active{transform:scale(.96)}
.preview{position:fixed;inset:0;z-index:30;background:#04060c;display:none}
#cv{width:100%;height:100%;display:block}
.pv-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left))}
.pv-back{background:rgba(15,19,34,.75);border:1px solid var(--line);color:var(--txt);font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px)}
.pv-chip{background:rgba(15,19,34,.75);border:1px solid var(--line);color:#ffd28a;font-size:12px;padding:8px 14px;border-radius:999px;backdrop-filter:blur(8px)}
.pv-bottom{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:rgba(255,255,255,.45);pointer-events:none}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-10px);background:rgba(18,23,42,.96);border:1px solid var(--line);color:var(--txt);font-size:13px;padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:86vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="logo">🎬 星幕影城</div>
    <div class="sub">在线选座 · 座位视角预览</div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="hall-info" id="hallInfo"></div>
  <div class="movie-card">
    <div class="mc-ico">🎥</div>
    <div class="mc-mid">
      <div class="mc-title">《星际漫游》</div>
      <div class="mc-meta">2D · 国语 · 今天 19:30</div>
    </div>
    <div class="mc-tag">热映中</div>
  </div>
  <div class="screen-wrap"><div class="screen"><span>银 幕 中 央</span></div></div>
  <div id="seatArea"></div>
  <div class="legend">
    <span><i class="s"></i>可选</span>
    <span><i class="s s-sold"></i>已售</span>
    <span><i class="s s-sel"></i>已选</span>
    <span class="legend-tip">👆 点击座位预览该座观影视角</span>
  </div>
</div>

<div class="bottom">
  <div class="bottom-in">
    <div class="sel-chips" id="selChips"></div>
    <div class="bt-total">合计 <b id="totalPrice">¥0</b></div>
    <button id="confirmBtn">确认选座</button>
  </div>
</div>

<div class="preview" id="preview">
  <canvas id="cv"></canvas>
  <div class="pv-top">
    <button class="pv-back">‹ 返回选座</button>
    <div class="pv-chip" id="pvChip"></div>
  </div>
  <div class="pv-bottom">点击画面任意位置可返回选座</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ========== 厅型配置 ========== */
const HALLS = [
  {key:'da', name:'大厅', cols:20, rows:14, aisle:true,  couple:false, price:49,
   info:'280座 · 中央过道 · 杜比全景声', screenW:16, screenH:7.2, pitch:0.55, rowGap:1.15, z0:6.0, riser:0.33, ceil:7.5, accent:'#e8b45a'},
  {key:'zhong', name:'中厅', cols:12, rows:10, aisle:false, couple:false, price:45,
   info:'120座 · 激光巨幕 · 环绕声', screenW:11, screenH:5.2, pitch:0.58, rowGap:1.1, z0:5.0, riser:0.32, ceil:6.0, accent:'#6a8dff'},
  {key:'xiao', name:'小厅', cols:8, rows:7, aisle:false, couple:false, price:39,
   info:'56座 · 舒适小厅 · 私密观影', screenW:8, screenH:4.0, pitch:0.6, rowGap:1.0, z0:4.0, riser:0.30, ceil:5.2, accent:'#59d6b8'},
  {key:'ql', name:'情侣厅', cols:7, rows:8, aisle:false, couple:true, price:99,
   info:'56座 · 双人沙发 · 情侣专享', screenW:9, screenH:4.6, pitch:1.15, rowGap:1.5, z0:4.5, riser:0.34, ceil:5.6, accent:'#ff7ab8'},
];
const hallBy = k => HALLS.find(h => h.key === k);
const $ = s => document.querySelector(s);

let curKey = 'zhong';
const sel = new Map(); // key -> {r,c}

/* ========== 工具 ========== */
function hash(s){ let h = 2166136261 >>> 0; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); } return h >>> 0; }
function rng(seed){ let s = seed >>> 0; return () => { s = (Math.imul(s,1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

const soldCache = {};
function soldSet(hall){
  if(!soldCache[hall.key]){
    const r = rng(hash('sold-' + hall.key));
    const set = new Set();
    for(let i=0;i<hall.rows;i++) for(let j=0;j<hall.cols;j++) if(r() < 0.16) set.add(i + '-' + j);
    soldCache[hall.key] = set;
  }
  return soldCache[hall.key];
}
function seatNum(hall, c){
  if(hall.aisle){ const half = hall.cols/2; return c < half ? c*2+1 : (c-half)*2+2; }
  return c + 1;
}
function seatHTML(hall, r, c){
  const k = r + '-' + c, num = seatNum(hall, c);
  const cls = ['seat'];
  if(hall.couple) cls.push('couple');
  if(soldSet(hall).has(k)) cls.push('sold');
  if(sel.has(k)) cls.push('sel');
  const inner = hall.couple ? `<i>💗</i><b>${num}</b>` : `${num}`;
  return `<div class="${cls.join(' ')}" data-k="${k}">${inner}</div>`;
}

/* ========== 座位图 ========== */
function renderHall(){
  const hall = hallBy(curKey);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.k === curKey));
  $('#hallInfo').textContent = `${hall.name} · ${hall.info}`;
  let html = '';
  if(hall.aisle) html += `<div class="srow"><div class="rlabel"></div><div class="blocks"><div class="zone">左区 · 单号</div><div class="zone">右区 · 双号</div></div></div>`;
  else if(hall.couple) html += `<div class="srow"><div class="rlabel"></div><div class="blocks"><div class="zone">情 侣 座 区</div></div></div>`;
  for(let r=0; r<hall.rows; r++){
    html += `<div class="srow"><div class="rlabel">${r+1}排</div>`;
    if(hall.aisle){
      const half = hall.cols/2;
      html += `<div class="blocks"><div class="block" style="--cols:${half}">`;
      for(let c=0;c<half;c++) html += seatHTML(hall,r,c);
      html += `</div><div class="block" style="--cols:${half}">`;
      for(let c=half;c<hall.cols;c++) html += seatHTML(hall,r,c);
      html += `</div></div>`;
    }else{
      html += `<div class="blocks"><div class="block" style="--cols:${hall.cols}">`;
      for(let c=0;c<hall.cols;c++) html += seatHTML(hall,r,c);
      html += `</div></div>`;
    }
    html += `</div>`;
  }
  $('#seatArea').innerHTML = html;
  updateBar();
}

function updateBar(){
  const hall = hallBy(curKey);
  if(!sel.size){
    $('#selChips').innerHTML = `<span class="bt-empty">请先选择座位，点击座位可预览视角</span>`;
    $('#totalPrice').textContent = '¥0';
    return;
  }
  let html = '', total = 0;
  sel.forEach((v,k) => {
    total += hall.price;
    html += `<span class="chip">${v.r+1}排${seatNum(hall,v.c)}座 <b data-x="${k}">×</b></span>`;
  });
  $('#selChips').innerHTML = html;
  $('#totalPrice').textContent = '¥' + total;
}

let toastTimer = 0;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ========== 事件 ========== */
$('#tabs').innerHTML = HALLS.map(h => `<div class="tab" data-k="${h.key}">${h.name}<small>${h.cols*h.rows}座</small></div>`).join('');
$('#tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if(!t) return;
  const k = t.dataset.k; if(k === curKey) return;
  curKey = k; sel.clear(); closePreview(true); renderHall();
});

$('#seatArea').addEventListener('click', e => {
  const el = e.target.closest('.seat'); if(!el) return;
  if(el.classList.contains('sold')) return;
  const hall = hallBy(curKey), k = el.dataset.k;
  const [r,c] = k.split('-').map(Number);
  if(sel.has(k)){ openPreview(el, hall, r, c); return; }
  if(sel.size >= 4){ toast('最多可选 4 个座位哦'); return; }
  sel.set(k, {r,c});
  el.classList.add('sel');
  updateBar();
  setTimeout(() => { if(document.body.contains(el) && curKey === hall.key) openPreview(el, hall, r, c); }, 280);
});

$('#selChips').addEventListener('click', e => {
  const x = e.target.closest('b[data-x]'); if(!x) return;
  const k = x.dataset.x;
  sel.delete(k);
  const el = document.querySelector(`.seat[data-k="${k}"]`);
  if(el) el.classList.remove('sel');
  updateBar();
});

$('#confirmBtn').addEventListener('click', () => {
  if(!sel.size){ toast('请先选择座位哦 🎬'); return; }
  const hall = hallBy(curKey);
  const parts = [...sel.values()].map(v => `${v.r+1}排${seatNum(hall,v.c)}座`);
  toast(`🎫 出票成功！已锁定 ${parts.join('、')}，祝您观影愉快`);
});

/* ========== 座位视角预览（伪3D canvas） ========== */
const pv = $('#preview'), cv = $('#cv'), ctx = cv.getContext('2d');
let pvOpen = false, pvHall = null, pvR = 0, pvC = 0, pvRect = null, raf = 0;

const cross = (a,b) => ({x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x});
const sub   = (a,b) => ({x:a.x-b.x, y:a.y-b.y, z:a.z-b.z});
const norm  = v => { const l = Math.hypot(v.x,v.y,v.z) || 1; return {x:v.x/l, y:v.y/l, z:v.z/l}; };
const dot   = (a,b) => a.x*b.x + a.y*b.y + a.z*b.z;

function resizeCanvas(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function openPreview(seatEl, hall, r, c){
  pvRect = seatEl.getBoundingClientRect();
  pvOpen = true; pvHall = hall; pvR = r; pvC = c;
  $('#pvChip').textContent = hall.couple
    ? `${hall.name} · ${r+1}排${seatNum(hall,c)}号情侣座 · 我的视角`
    : `${hall.name} · ${r+1}排${seatNum(hall,c)}座 · 我的视角`;
  pv.style.display = 'block';
  resizeCanvas();
  draw(performance.now()/1000);
  const vw = innerWidth, vh = innerHeight, rc = pvRect;
  const sx = Math.max(rc.width/vw, 0.02), sy = Math.max(rc.height/vh, 0.02);
  pv.style.transition = 'none';
  pv.style.opacity = '0';
  pv.style.transform = `translate(${rc.left+rc.width/2-vw/2}px,${rc.top+rc.height/2-vh/2}px) scale(${sx},${sy})`;
  void pv.offsetWidth;
  pv.style.transition = 'transform .5s cubic-bezier(.2,.85,.25,1), opacity .4s ease';
  pv.style.opacity = '1';
  pv.style.transform = 'translate(0px,0px) scale(1,1)';
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(frame);
}

function closePreview(skipAnim){
  if(!pvOpen) return;
  pvOpen = false;
  cancelAnimationFrame(raf);
  if(skipAnim || !pvRect){ pv.style.display = 'none'; return; }
  const vw = innerWidth, vh = innerHeight, rc = pvRect;
  const sx = Math.max(rc.width/vw, 0.02), sy = Math.max(rc.height/vh, 0.02);
  pv.style.transition = 'transform .42s cubic-bezier(.5,0,.75,.4), opacity .35s ease';
  pv.style.opacity = '0';
  pv.style.transform = `translate(${rc.left+rc.width/2-vw/2}px,${rc.top+rc.height/2-vh/2}px) scale(${sx},${sy})`;
  setTimeout(() => { if(!pvOpen) pv.style.display = 'none'; }, 430);
}

function frame(ts){ if(!pvOpen) return; raf = requestAnimationFrame(frame); draw(ts/1000); }

pv.addEventListener('click', () => closePreview(false));
window.addEventListener('keydown', e => { if(e.key === 'Escape') closePreview(false); });
window.addEventListener('resize', () => { if(pvOpen){ resizeCanvas(); draw(performance.now()/1000); } });

/* ========== 3D 场景绘制 ========== */
function draw(t){
  const W = innerWidth, H = innerHeight;
  const hall = pvHall; if(!hall) return;
  const sw = hall.screenW, sh = hall.screenH;
  const f = H * 1.05;

  // 相机：坐在所选座位上，看向银幕中心
  const seatX = (pvC+0.5)*hall.pitch - hall.cols*hall.pitch/2;
  const seatZ = hall.z0 + pvR*hall.rowGap + 0.3;
  const C = {x:seatX, y:pvR*hall.riser + 1.12, z:seatZ};
  const T = {x:0, y:sh*0.62, z:0};
  const fwd = norm(sub(T,C));
  const right = norm(cross(fwd, {x:0,y:1,z:0}));
  const up = cross(right, fwd);
  const P = p => {
    const v = sub(p, C);
    const zc = dot(v, fwd);
    if(zc < 0.15) return null;
    return { x: W/2 + dot(v,right)*f/zc, y: H/2 - dot(v,up)*f/zc, zc };
  };

  // 背景
  let g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#12152a'); g.addColorStop(1,'#080a12');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  const fx = sw/2 + 2.4;
  const zb = hall.z0 + hall.rows*hall.rowGap + 0.8;

  // 银幕背光
  const sc = P({x:0, y:sh*0.5, z:0});
  if(sc){
    ctx.globalCompositeOperation = 'screen';
    const rad = Math.max(W,H)*0.55;
    const gg = ctx.createRadialGradient(sc.x,sc.y,0,sc.x,sc.y,rad);
    gg.addColorStop(0,'rgba(110,140,255,0.20)'); gg.addColorStop(1,'rgba(110,140,255,0)');
    ctx.fillStyle = gg; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'source-over';
  }

  // 天花板
  (function(){
    const a=P({x:-fx,y:hall.ceil,z:0}), b=P({x:fx,y:hall.ceil,z:0}),
          c=P({x:fx,y:hall.ceil,z:zb}), d=P({x:-fx,y:hall.ceil,z:zb});
    if(a&&b&&c&&d){
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.closePath();
      ctx.fillStyle = '#0a0d16'; ctx.fill();
    }
  })();

  // 两侧墙面 + 灯带
  (function(){
    for(const xw of [-fx, fx]){
      const a=P({x:xw,y:0,z:0}), b=P({x:xw,y:hall.ceil,z:0}),
            c=P({x:xw,y:hall.ceil,z:zb}), d=P({x:xw,y:0,z:zb});
      if(!a||!b||!c||!d) continue;
      const gn=P({x:xw,y:1.5,z:0.5}), gf=P({x:xw,y:1.5,z:zb});
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.closePath();
      if(gn&&gf){
        const gr = ctx.createLinearGradient(gn.x,gn.y,gf.x,gf.y);
        gr.addColorStop(0,'#1a2034'); gr.addColorStop(1,'#0b0e18');
        ctx.fillStyle = gr;
      } else ctx.fillStyle = '#0d101b';
      ctx.fill();
      // 银幕旁装饰灯带
      const sgn = xw < 0 ? 0.15 : -0.15;
      const w1 = P({x:xw+sgn, y:0, z:0.15}), w2 = P({x:xw+sgn, y:hall.ceil*0.85, z:0.15});
      if(w1&&w2){
        ctx.save();
        ctx.strokeStyle = hall.accent; ctx.globalAlpha = 0.5; ctx.lineWidth = 2;
        ctx.shadowColor = hall.accent; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.moveTo(w1.x,w1.y); ctx.lineTo(w2.x,w2.y); ctx.stroke();
        ctx.restore();
      }
    }
  })();

  // 阶梯式地面：银幕前平地 + 逐排升高的台阶
  (function(){
    const half = hall.rowGap/2;
    // 银幕前平地
    const zA = hall.z0 - half;
    const a=P({x:-fx,y:0,z:0}), b=P({x:fx,y:0,z:0}), c=P({x:fx,y:0,z:zA}), d=P({x:-fx,y:0,z:zA});
    if(a&&b&&c&&d){
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.closePath();
      const ga=P({x:0,y:0,z:0.2}), gb=P({x:0,y:0,z:zA});
      if(ga&&gb){
        const gr = ctx.createLinearGradient(ga.x,ga.y,gb.x,gb.y);
        gr.addColorStop(0,'#1b2138'); gr.addColorStop(1,'#101525');
        ctx.fillStyle = gr;
      } else ctx.fillStyle = '#151a2c';
      ctx.fill();
    }
    // 台阶（相机所在排之前的部分才可见）
    for(let i=0; i<pvR; i++){
      const zi = hall.z0 + i*hall.rowGap;
      const yB = i*hall.riser;
      // 台阶面（踩脚面）
      const t1=P({x:-fx,y:yB,z:zi-half}), t2=P({x:fx,y:yB,z:zi-half}),
            t3=P({x:fx,y:yB,z:zi+half}), t4=P({x:-fx,y:yB,z:zi+half});
      if(t1&&t2&&t3&&t4){
        const ga=P({x:0,y:yB,z:zi-half}), gb=P({x:0,y:yB,z:zi+half});
        ctx.beginPath(); ctx.moveTo(t1.x,t1.y); ctx.lineTo(t2.x,t2.y); ctx.lineTo(t3.x,t3.y); ctx.lineTo(t4.x,t4.y); ctx.closePath();
        if(ga&&gb){
          const gr = ctx.createLinearGradient(ga.x,ga.y,gb.x,gb.y);
          gr.addColorStop(0,'#1a2136'); gr.addColorStop(1,'#0d101d');
          ctx.fillStyle = gr;
        } else ctx.fillStyle = '#101425';
        ctx.fill();
        // 台阶前沿亮边
        ctx.beginPath(); ctx.moveTo(t1.x,t1.y); ctx.lineTo(t2.x,t2.y);
        ctx.strokeStyle = 'rgba(150,170,255,0.10)'; ctx.lineWidth = 1; ctx.stroke();
      }
      // 台阶立面（挡板）
      const zR = zi + half;
      const r1=P({x:-fx,y:yB,z:zR}), r2=P({x:fx,y:yB,z:zR}),
            r3=P({x:fx,y:yB+hall.riser,z:zR}), r4=P({x:-fx,y:yB+hall.riser,z:zR});
      if(r1&&r2&&r3&&r4){
        ctx.beginPath(); ctx.moveTo(r1.x,r1.y); ctx.lineTo(r2.x,r2.y); ctx.lineTo(r3.x,r3.y); ctx.lineTo(r4.x,r4.y); ctx.closePath();
        ctx.fillStyle = '#0a0d17'; ctx.fill();
      }
    }
  })();

  // 天花板筒灯
  (function(){
    ctx.save();
    for(const lx of [-sw*0.28, 0, sw*0.28]){
      for(let z=0.6; z<zb; z+=1.3){
        const p = P({x:lx, y:hall.ceil-0.06, z});
        if(!p) continue;
        const r = Math.max(1, 0.05*f/p.zc);
        ctx.beginPath(); ctx.arc(p.x,p.y,r,0,6.2832);
        ctx.fillStyle = hall.couple ? '#ffd9ec' : '#ffe9c4';
        ctx.shadowColor = hall.accent; ctx.shadowBlur = r*3;
        ctx.globalAlpha = Math.min(1, 60/p.zc) * (0.92 + 0.08*Math.sin(t*2.6 + z*1.7));
        ctx.fill();
      }
    }
    ctx.restore();
  })();

  // 银幕
  const stl=P({x:-sw/2,y:sh,z:0}), str=P({x:sw/2,y:sh,z:0}),
        sbl=P({x:-sw/2,y:0,z:0}),  sbr=P({x:sw/2,y:0,z:0});
  if(stl&&str&&sbl&&sbr){
    ctx.beginPath(); ctx.moveTo(stl.x,stl.y); ctx.lineTo(str.x,str.y); ctx.lineTo(sbr.x,sbr.y); ctx.lineTo(sbl.x,sbl.y); ctx.closePath();
    ctx.fillStyle = '#04050a'; ctx.fill();
    ctx.save();
    ctx.setTransform(str.x-stl.x, str.y-stl.y, sbl.x-stl.x, sbl.y-stl.y, stl.x, stl.y);
    drawMovie(t);
    ctx.restore();
    ctx.beginPath(); ctx.moveTo(stl.x,stl.y); ctx.lineTo(str.x,str.y); ctx.lineTo(sbr.x,sbr.y); ctx.lineTo(sbl.x,sbl.y); ctx.closePath();
    ctx.strokeStyle = 'rgba(150,170,255,0.16)'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  // 前排座位（从远到近）
  const rowTop = 0.88, rowLow = 0.55;
  const gap = hall.aisle ? 0.9 : 0;
  const blockW = hall.cols * hall.pitch;
  for(let i=pvR-1; i>=0; i--){
    const z = hall.z0 + i*hall.rowGap;
    const yB = i*hall.riser; // 该排所在台阶的高度
    const band = (x0,x1) => {
      const a=P({x:x0,y:yB+rowTop,z}), b=P({x:x1,y:yB+rowTop,z}),
            c=P({x:x1,y:yB+rowLow,z}), d=P({x:x0,y:yB+rowLow,z});
      if(!a||!b||!c||!d) return;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.closePath();
      ctx.fillStyle = '#121829'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
      ctx.strokeStyle = 'rgba(150,170,255,0.12)'; ctx.lineWidth = 1; ctx.stroke();
    };
    if(gap){ band(-blockW/2,-gap/2); band(gap/2,blockW/2); }
    else band(-blockW/2, blockW/2);
    // 近处座位画椅背细节
    const mid = P({x:0, y:yB+0.7, z});
    if(mid && mid.zc < 16){
      for(let j=0;j<hall.cols;j++){
        const x0 = -blockW/2 + j*hall.pitch, x1 = x0 + hall.pitch*0.72;
        if(gap && Math.abs((x0+x1)/2) < gap/2) continue;
        const p1=P({x:x0,y:yB+rowTop+0.05,z}), p2=P({x:x1,y:yB+rowTop+0.05,z}),
              p3=P({x:x1,y:yB+0.75,z}),       p4=P({x:x0,y:yB+0.75,z});
        if(!p1||!p2||!p3||!p4) continue;
        ctx.fillStyle = `rgba(150,170,220,${Math.max(0.03, 0.15*(1 - mid.zc/16))})`;
        ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.lineTo(p3.x,p3.y); ctx.lineTo(p4.x,p4.y); ctx.closePath(); ctx.fill();
      }
    }
  }

  // 银幕光洒向观众席（轻微闪烁）
  if(sc){
    ctx.globalCompositeOperation = 'screen';
    const flick = 0.90 + 0.10*Math.sin(t*2.3) + 0.03*Math.sin(t*9.7);
    const gr = ctx.createRadialGradient(sc.x,sc.y,H*0.15,sc.x,sc.y,H*0.95);
    gr.addColorStop(0,`rgba(120,150,255,${0.10*flick})`); gr.addColorStop(1,'rgba(120,150,255,0)');
    ctx.fillStyle = gr; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'source-over';
  }

  // 暗角
  const vg = ctx.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.35,W/2,H*0.45,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
}

/* 银幕上的"电影画面"（单位坐标系） */
const starCache = {};
function drawMovie(t){
  const hall = pvHall;
  if(!starCache[hall.key]){
    const r = rng(hash('stars-' + hall.key));
    starCache[hall.key] = Array.from({length:70}, () => ({
      x:r(), y:r()*0.5, ph:r()*6.283, sp:0.6+r()*2.2, s:0.002+r()*0.005
    }));
  }
  const sky = ctx.createLinearGradient(0,0,0,1);
  sky.addColorStop(0,'#060a20'); sky.addColorStop(0.55,'#111b4a');
  sky.addColorStop(0.8,'#45285e'); sky.addColorStop(0.95,'#9a4f4a');
  ctx.fillStyle = sky; ctx.fillRect(0,0,1,1);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for(const s of starCache[hall.key]){
    ctx.globalAlpha = 0.25 + 0.6*(0.5 + 0.5*Math.sin(t*s.sp + s.ph));
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
  // 月亮
  const mg = ctx.createRadialGradient(0.68,0.2,0,0.68,0.2,0.14);
  mg.addColorStop(0,'rgba(255,240,210,0.5)'); mg.addColorStop(1,'rgba(255,240,210,0)');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(0.68,0.2,0.14,0,6.2832); ctx.fill();
  ctx.fillStyle = '#f4ecd6'; ctx.beginPath(); ctx.arc(0.68,0.2,0.05,0,6.2832); ctx.fill();
  // 山影
  ridge('#171e40', [[0,0.85],[0.1,0.68],[0.22,0.8],[0.34,0.62],[0.48,0.78],[0.62,0.66],[0.78,0.76],[0.9,0.7],[1,0.78]]);
  ridge('#0c1026', [[0,0.95],[0.15,0.8],[0.3,0.92],[0.45,0.78],[0.6,0.9],[0.75,0.8],[0.88,0.9],[1,0.84]]);
  // 片名
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(235,240,255,0.95)';
  ctx.font = '700 0.05px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('星际漫游', 0.5, 0.92);
  ctx.fillStyle = 'rgba(235,240,255,0.5)';
  ctx.font = '500 0.024px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('正 在 放 映', 0.5, 0.962);
}
function ridge(color, pts){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.lineTo(1,1); ctx.lineTo(0,1); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
}

/* ========== 启动 ========== */
renderHall();
setTimeout(() => toast('👆 点击任意可选座位，即可预览该座观影视角'), 800);
</script>
